server:
  port: ${PORT:8080}

spring:
  application:
    name: ill-be-there
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/illbethere}
    username: ${SPRING_DATASOURCE_USERNAME:illbethere}
    password: ${SPRING_DATASOURCE_PASSWORD:illbethere}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  frontend-base-path: ${FRONTEND_BASE_PATH:}
  jwt-secret: ${JWT_SECRET:dev-only-change-me-use-at-least-32-chars!!}
  token-encrypt-key: ${TOKEN_ENCRYPT_KEY:dev-only-token-key-32-chars!!}
  osm-import-token: ${OSM_IMPORT_TOKEN:dev-import}
  timezone: Asia/Jerusalem
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      maximum-pool-size: 5
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
