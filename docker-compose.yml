services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: illbethere
      POSTGRES_PASSWORD: illbethere
      POSTGRES_DB: illbethere
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U illbethere"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/illbethere
      SPRING_DATASOURCE_USERNAME: illbethere
      SPRING_DATASOURCE_PASSWORD: illbethere
      FRONTEND_ORIGIN: http://localhost:5173
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-please-change-32}
      TOKEN_ENCRYPT_KEY: ${TOKEN_ENCRYPT_KEY:-local-dev-token-key-32chars}
      OSM_IMPORT_TOKEN: ${OSM_IMPORT_TOKEN:-dev-import}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
